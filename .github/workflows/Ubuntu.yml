name: Ubuntu
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev libssh-dev pkg-config
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build ztmate-ssh-server
        run: zig build
      - name: Run unit tests
        run: zig build test --summary all
